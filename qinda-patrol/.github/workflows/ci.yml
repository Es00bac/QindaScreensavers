name: Build and smoke test
on: [push, pull_request]
jobs:
  qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev
      - name: Build desktop and optional Quick adapter
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPATROL_BUILD_QUICK=ON && cmake --build build --parallel 2
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: Offscreen Qt smoke test (not Wayland qualification)
        run: QT_QPA_PLATFORM=offscreen ./build/qinda-patrol --preview --demo --duration 2
